# ============================================================================
#  浙江省商贸业联合会 — Decap CMS 配置
#  https://decapcms.org/
#
#  本地编辑（本仓库采用的方案）：
#     npm install          # 首次安装 decap-server
#     npm run cms          # 终端 A：decap-server（http://localhost:8081）
#     npm run dev          # 终端 B：hugo server （http://localhost:1313）
#     浏览器打开 http://localhost:1313/admin/
#
#  设计要点见 CMS.md，三处关键约定：
#   1) 文章集合用 filter 过滤 categories 字段，从而把 Hugo 的 _index.md
#      （栏目页，没有 categories）挡在列表之外。原理解释见 CMS.md。
#   2) 每个集合的 categories 都是 hidden 字段并带 default，新建文章会自动
#      带上正确分类，否则会被 filter 过滤掉而在列表里“消失”。
#   3) date/lastmod 用 'YYYY-MM-DDTHH:mm:ssZ' 存储，写出的是带 +08:00 偏移
#      的本地时间（与 `hugo new content` 一致），避免纯日期被 Hugo 当成
#      UTC 午夜而在构建时按“未来文章”丢弃。
# ============================================================================

# ---- 本地后端（beta）：由 decap-server 代理读写本机 git 工作区 ----
local_backend: true

# local_backend 生效时，请求都走本机代理；此处 backend 仅作为占位。
# 若日后要开放线上编辑，改成 github 后端并配置 OAuth 代理，例如：
#   backend:
#     name: github
#     repo: benyinshisan/zjsm-hugo
#     branch: main
#     base_url: https://<你的 OAuth 代理域名>
backend:
  name: git-gateway
  branch: main

# 本地后端不支持编辑工作流，只能用 simple
publish_mode: simple

site_url: https://www.zjsm.org
display_url: https://www.zjsm.org

# 非英语界面；index.html 加载的是完整版 decap-cms，已内置全部语言包
locale: zh_Hans

# 本地后端不产生部署预览，关掉工具条上的预览链接按钮
show_preview_links: false

# 文件名/媒体名保留中文：Hugo 已开启 hasCJKLanguage，中文 URL 可正常工作。
# 若要强制 ASCII 文件名，改成 encoding: ascii 即可（中文标题会被丢弃）。
slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: '-'

# 图片上传到 static/uploads，页面里引用 /uploads/...
media_folder: static/uploads
public_folder: /uploads


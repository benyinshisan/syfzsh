      - name: overview
        label: 概 况
        file: content/about/overview.md
        fields: &about_fields
          - {label: 标题, name: title, widget: string}
          - {label: 导航短标题, name: linkTitle, widget: string, required: false}
          - {label: 排序权重, name: weight, widget: number, value_type: int, required: false, hint: 数字越小越靠前}
          - {label: 描述, name: description, widget: text, required: false}
          - {label: 正文, name: body, widget: markdown}
      - name: charter
        label: 章 程
        file: content/about/charter.md
        fields: *about_fields
      - name: organization
        label: 组织机构
        file: content/about/organization.md
        fields: *about_fields
      - name: join
        label: 入会指南
        file: content/about/join.md
        fields: *about_fields
      - name: contact
        label: 联系我们
        file: content/about/contact.md
        fields: *about_fields

  # ==========================================================================
  #  数据文件（data/*.yaml）
  #  注意：Decap 会重新序列化整个 YAML 文件，文件顶部的说明性注释会丢失。
  # ==========================================================================
  - name: data-members
    label: 数据 · 会员名单
    description: 对应 data/members.yaml，首页“会员名录”滚动条的数据来源。
    files:
      - name: members
        label: 会员单位名单
        file: data/members.yaml
        fields:
          - label: 会员单位 / 个人
            name: members
            widget: list
            required: false
            hint: 每行一个名称，顺序即首页滚动顺序。
            field: {label: 名称, name: item, widget: string}

  - name: data-friendlinks
    label: 数据 · 友情链接
    description: 对应 data/friendlinks.yaml，首页底部“友情链接”的数据来源。
    files:
      - name: friendlinks
        label: 友情链接
        file: data/friendlinks.yaml
        # 这里的字段名必须与 data/friendlinks.yaml 的顶层键完全一致，
        # 模板 layouts/partials/home/friendlinks.html 直接把这些键当作分组标题渲染。
        fields:
          - label: 协会站点
            name: 协会站点
            widget: list
            required: false
            field: {label: 链接, name: item, widget: object, fields: [{label: 名称, name: name, widget: string}, {label: 网址, name: url, widget: string}]}
          - label: 企业站点
            name: 企业站点
            widget: list
            required: false
            field: {label: 链接, name: item, widget: object, fields: [{label: 名称, name: name, widget: string}, {label: 网址, name: url, widget: string}]}
          - label: 政府站点
            name: 政府站点
            widget: list
            required: false
            field: {label: 链接, name: item, widget: object, fields: [{label: 名称, name: name, widget: string}, {label: 网址, name: url, widget: string}]}
          - label: 智囊站点
            name: 智囊站点
            widget: list
            required: false
            field: {label: 链接, name: item, widget: object, fields: [{label: 名称, name: name, widget: string}, {label: 网址, name: url, widget: string}]}

  - name: data-partners
    label: 数据 · 协会链接
    description: 对应 data/partners.yaml，首页右栏“协会链接”图片位的数据来源。
    files:
      - name: partners
        label: 协会 / 会员单位
        file: data/partners.yaml
        fields:
          - label: 单位列表
            name: partners
            widget: list
            required: false
            field:
              label: 单位
              name: item
              widget: object
              fields:
                - {label: 名称, name: name, widget: string}
                - {label: 标志图片, name: logo, widget: image, required: false}
                - {label: 网址, name: url, widget: string, required: false}

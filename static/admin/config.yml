    label_singular: 通知公告
    description: 本会发布的各类通知、公告与征求意见稿。
    folder: content/news/notice
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    preview_path: 'news/notice/{{slug}}'
    filter: {field: categories, value: news}
    fields:
      - {label: 标题, name: title, widget: string}
      - {label: 发布日期, name: date, widget: datetime, format: 'YYYY-MM-DDTHH:mm:ssZ', default: '{{now}}'}
      - {label: 更新日期, name: lastmod, widget: datetime, format: 'YYYY-MM-DDTHH:mm:ssZ', required: false}
      - {label: 摘要, name: summary, widget: text, required: false}
      - {label: 栏目分类, name: categories, widget: hidden, default: [news]}
      - {label: 标签, name: tags, widget: list, required: false, field: {label: 标签, name: tag, widget: string}}
      - {label: 来源, name: source, widget: string, required: false}

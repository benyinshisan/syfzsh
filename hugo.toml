##############################################################################
#  协会 / 商会站点 Hugo 配置模板
#
#  这是一个「响应式空骨架」模板：栏目、配色、内容均为占位，
#  改成你自己的项目时，按下面的注释逐段替换即可。
#
#  版本要求：Hugo >= 0.156（extended 非必需，本模板不使用 Sass）
##############################################################################

baseURL        = "https://chihayam.github.io/syfzsh/"
title          = "兰州市商业发展商会"
defaultContentLanguage = "zh"
locale         = "zh-CN"
hasCJKLanguage = true
enableRobotsTXT = true
summaryLength  = 120

# categories 只作为 Decap CMS 的过滤器使用（见 static/admin/config.yml），
# 不需要生成 /categories/ 归档页，故关闭分类法输出。
disableKinds = ["taxonomy", "term"]

# 输出：首页额外产出 JSON 搜索索引（layouts/index.searchindex.json）
[outputs]
  home    = ["HTML", "RSS", "searchindex"]
  section = ["HTML", "RSS"]

[outputFormats.searchindex]
  mediaType      = "application/json"
  baseName       = "searchindex"
  isPlainText    = true
  notAlternative = true

# 图片放在 assets/uploads/ 里，Hugo 才能缩放 + 转 WebP + 补上宽高（防 CLS）。
# 但 assets/ 里的文件默认**不发布**，而后台的媒体库是浏览器里跑的 —— 它只能
# 通过 /uploads/... 这个网址去取图，取不到就整片缩略图全是破图。
# 所以这里额外挂一条：把 assets/uploads 同时当作静态文件发布一份原图。
#
# 代价是 public/ 里原图和 WebP 各存一份（构建产物，不占 git）。访客拿到的仍然
# 是页面里引用的 WebP，原图只有后台上传/预览时才会请求。
#
# ⚠ 一旦写了 [[module.mounts]]，Hugo 的默认挂载会被整体替换掉，
#   所以必须把用到的目录一个不落地列全（本仓库没有 i18n/ 目录，故不列）。
[module]
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets/uploads"
    target = "static/uploads"

[markup]
  [markup.goldmark.renderer]
    unsafe = true          # 正文允许内联 HTML
  [markup.goldmark.parser]
    # 独占一行的图片不再被 <p> 包住。
    # ⚠ 这个选项默认是 true，此时正文图片渲染钩子拿到的 .IsBlock 恒为 false，
    #   钩子输出的 <figure> 会被套进 <p> 里，变成 <p><figure>…</figure></p>
    #   这种非法嵌套 —— 浏览器容错会补出一个空 <p>，多吃一倍段间距。
    #   关掉它之后图片独占一段，.IsBlock 才是 true。
    #   本站 content/ 下目前 0 处 Markdown 图片语法，开这个开关零风险。
    wrapStandAloneImageWithinParagraph = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3

[pagination]
  # 每页条数。二级栏目按它直接分页；一级栏目（/news/ 这种）先把各子栏目的
  # 文章汇总，再按它分页（见 layouts/_default/list.html）。
  # ⚠ 想肉眼验证分页器，把它临时改小（如 3）—— 现在全站内容都不到 10 条，
  #   正常值下**看不到分页器是正常的**，不代表分页坏了。
  pagerSize = 10

##############################################################################
#  站点参数
##############################################################################
[params]
  siteName    = "兰州市商业发展商会"
  shortName   = "商会"
  slogan      = "服务会员企业 · 共促商业发展"
  description = "兰州市商业发展商会官方网站，发布商会动态、通知公告、行业资讯与会员服务信息，搭建会员企业与政府、行业之间的沟通桥梁。"
  keywords    = "兰州市商业发展商会,兰州商会,商业发展商会,商会动态,会员服务,兰州商贸"

  # ---- 条目型栏目 --------------------------------------------------------
  # 这些栏目下的页面是「条目」而非「文章」：它们是独立对象，不该被当成文章
  # 混进上级栏目的列表里（会员企业不该出现在「会员天地」栏目页的文章流里）。
  # 值填 content/ 下的栏目路径；一级栏目汇总时会排除这些栏目下的全部页面。
  entrySections = ["members/directory"]

  # ---- 页脚联系信息 ----
  # 下面这些值只填「内容」，不要带「电话：」这样的前缀 —— 前缀由
  # layouts/partials/footer.html 统一输出，方便你一次性改排版。
  [params.contact]
    organizer = "兰州市商业发展商会"
    address   = "兰州市城关区静宁路100号"
    zip       = "730030"
    tel       = "000-00000000"
    fax       = "000-00000000"
    email     = "email@example.com"
    icpCode   = ""            # 如 "京ICP备00000000号"，留空则整行不输出
    vendor    = ""            # 建站服务商，留空则不输出「策划制作」一栏
    vendorUrl = ""

  # ---- 顶部工具条链接 ----
  [[params.topLinks]]
    label = "联系我们"
    url   = "/about/contact/"

  # ---- 首页版块 ----------------------------------------------------------
  # ⚠ 首页各版块的**标题、条数、数据来源栏目**不在这个文件里，已挪到
  #   data/home.yaml —— 后台「首页 / 首页版块」编辑的就是它。
  #   那是个 YAML 文件，改它不用动代码，也不会像 TOML 那样被后台重写丢注释。
  #   见 README 的 §3.4。

  # ---- 页脚会员名录条 ----------------------------------------------------
  # 页脚那条无缝滚动的会员名录（只在**内页**输出，首页有 LOGO 墙，不重复）。
  # 数据源是会员内容页，这里只有一个滚动区高度。
  [params.footer]
    # 滚动区高度（px），可在 CSS 里用 --marquee-h 覆盖。
    # ⚠ 这是**兜底高度**。滚动逻辑（theme.js 的 initMarquee）靠容器的确定高度
    #   判断「内容够不够一屏」，所以别把 .marquee 改成 height:auto ——
    #   那会让容器不再裁剪，整份列表连副本一起露出来。
    membersMarqueeHeight = 125

  # ---- 四页签切换区 ----
  # 页签为纯文字按钮，不需要切图；active = true 的是默认展开项。
  [[params.homeTabs]]
    label   = "政策法规"
    section = "policy"
    active  = true
  [[params.homeTabs]]
    label   = "党群工作"
    section = "party"
  [[params.homeTabs]]
    label   = "会员服务"
    section = "members/services"
  [[params.homeTabs]]
    label   = "媒体报道"
    section = "news/media"

  # ---- 右侧栏按钮（文字链接，原模板此处是图片位） ----
  [[params.sideLinks]]
    label = "入会指南"
    url   = "/about/join/"
  [[params.sideLinks]]
    label = "会员名录"
    url   = "/members/directory/"
  [[params.sideLinks]]
    label = "联系我们"
    url   = "/about/contact/"

  # ---- 首页搜索框 ----
  [params.search]
    enable      = true
    placeholder = "请输入关键词"
    action      = "/search/"

  # ---- 统计代码（留空即不输出） ----
  [params.analytics]
    cnzzId = ""

##############################################################################
#  主导航
#
#  ⚠ 改栏目时必须同改四处，漏一处就会导航出现空白项或构建报错：
#    1. content/<一级>/_index.md 与每个二级目录的 _index.md（目录必须存在）
#    2. 本段 [[menu.main]]（一级给 identifier，二级用 parent 关联）
#    3. data/home.yaml 里的各 xxxSection（首页版块配置已从本文件迁到那里，
#       后台「首页 / 首页版块」编辑的就是它；hugo.toml 里没有 [params.home] 了）
#    4. [[params.homeTabs]] 里的各 section
##############################################################################
[[menu.main]]
  name = "首页"
  pageRef = "/"
  weight = 1


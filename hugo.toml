# ---- 已移除的两个一级栏目（原模板遗留，2026-09 精简）-----------------------
#   标准规范：省级联合会才做团体标准编制，市级商会无此职能，整个栏目删除。
#   服务与合作：培训/咨询本就是「为会员服务」，并入「会员天地 / 会员服务」。
#   详见 README 的 §3.3 与 §7。

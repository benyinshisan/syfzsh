##############################################################################
#  双击可看版（离线预览）—— 配置叠加层
#
#  用途：产出一份**不经过任何服务器**、双击 index.html 就能在浏览器里翻的站点。
#  平时构建（npm run build）**不使用本文件**，public/ 不受任何影响。
#
#  用法：
#    npm run build:local          → 产物在 public-local/
#
#  它做了三件事，缺一不可：
#    1. relativeURLs — 把 /css/x.css 这类根路径改写成按页面深度计算的相对路径。
#       否则 file:// 下「网站根目录」是盘符根，所有样式/图片 404。
#    2. uglyURLs — 让每篇文章输出成 xxx.html 真实文件，而不是 xxx/index.html。
#       否则点是能点，但浏览器打开的是一个目录，只会列出文件清单。
#    3. 输出目录由 npm script 用 --destination 指到 public-local/（本文件不管）。
#
#  ⚠ 本文件**只用于本地离线预览**，不要拿它的产物去部署 —— 部署用 npm run build。
##############################################################################

relativeURLs = true
uglyURLs     = true
